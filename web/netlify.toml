# ==============================================================================
# 🏛️ ÀGBÀ ENGINE: NETLIFY PRODUCTION & DEV BRANCH CONFIGURATION
# ==============================================================================
[build]
  publish = "dist"
  command = "npm run build"

# API Proxy to Google Cloud Run Serverless Gateway
[[redirects]]
  from = "/api/*"
  to = "https://agba-enterprise-api-dgefvzanqq-uc.a.run.app/:splat"
  status = 200
  force = true

# Single Page Application (SPA) routing fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[context.production.environment]
  VITE_API_URL = "https://agba-enterprise-api-dgefvzanqq-uc.a.run.app"

[context.deploy-preview.environment]
  VITE_API_URL = "https://agba-enterprise-api-dgefvzanqq-uc.a.run.app"

[context.dev.environment]
  VITE_API_URL = "https://agba-enterprise-api-dgefvzanqq-uc.a.run.app"
